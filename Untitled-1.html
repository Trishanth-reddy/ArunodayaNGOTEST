<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
          font-family: Arial, sans-serif;
          text-align: center;
          background: #f8f9fa;
          padding: 50px 20px;
      }

      h2 {
          font-size: clamp(24px, 5vw, 28px);
          font-weight: bold;
          margin-bottom: 30px;
      }

      .at-red {
          color: #ff6363;
      }

      .gallery-container {
          width: min(700px, 100%);
          height: 638px;
          margin: auto;
          display: grid;
          position: relative;
          grid-template-columns: repeat(4, 1fr);
          gap: 15px;
          padding: 20px;
          border-radius: 10px;
          
      }

      .gallery img {
          position: absolute;
          object-fit: cover;
          border-radius: 10px;
          box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
          transition: transform 0.3s ease-in-out;
      }

      .gallery img:hover {
          transform: scale(1.05);
      }

      /* Setting exact positions for each box */
      .item1 { width: 271px; height: 235px; top: 25px; left: 30px; }
      .item2 { width: 154px; height: 144px; top: 25px; left: 327px; }
      .item3 { width: 154px; height: 144px; top: 25px; left: 507px; }
      .item4 { width: 271px; height: 147px; top: 291px; left: 30px; }
      .item5 { width: 334px; height: 235px; top: 203px; left: 327px; }
      .item6 { width: 154px; height: 144px; top: 469px; left: 30px; }
      .item7 { width: 154px; height: 144px; top: 469px; left: 211px; }
      .item8 { width: 271px; height: 144px; top: 469px; left: 390px; }

      .read-more-btn {
          margin-top: 20px;
          padding: 12px 25px;
          font-size: 16px;
          font-weight: bold;
          color: white;
          background: #ff6363;
          border: none;
          border-radius: 20px;
          cursor: pointer;
          transition: background 0.3s ease-in-out;
      }

      .read-more-btn:hover {
          background: #d14d4d;
      }

      /* Tablet Layout */
      @media (max-width: 768px) {
          .gallery-container {
              height: auto;
              padding: 15px;
              display: grid;
              grid-template-columns: repeat(2, 1fr);
              gap: 15px;
          }

          .gallery {
              position: relative;
              display: contents;
          }

          .gallery img {
              position: relative;
              width: 100%;
              height: 200px;
              top: auto;
              left: auto;
          }

          .item1, .item4, .item5, .item8 {
              grid-column: span 2;
          }
      }

      /* Mobile Layout */
      @media (max-width: 480px) {
          body {
              padding: 30px 15px;
          }

          .gallery-container {
              grid-template-columns: 1fr;
              padding: 10px;
              gap: 10px;
          }

          .gallery img {
              height: 250px;
          }

          .item1, .item2, .item3, .item4, .item5, .item6, .item7, .item8 {
              grid-column: span 1;
          }

          .read-more-btn {
              padding: 10px 20px;
              font-size: 14px;
              width: 80%;
              max-width: 200px;
          }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h2><span style="color: #d4a017;">OUR</span> <span class="at-red">GALLERY</span></h2>

      <div class="gallery-container">
        <div class="gallery">
          <img src="https://source.unsplash.com/random/271x235?nature" alt="Nature" class="item1" loading="lazy">
          <img src="https://source.unsplash.com/random/154x144?architecture" alt="Architecture" class="item2" loading="lazy">
          <img src="https://source.unsplash.com/random/154x144?travel" alt="Travel" class="item3" loading="lazy">
          <img src="https://source.unsplash.com/random/271x147?food" alt="Food" class="item4" loading="lazy">
          <img src="https://source.unsplash.com/random/334x235?technology" alt="Technology" class="item5" loading="lazy">
          <img src="https://source.unsplash.com/random/154x144?sports" alt="Sports" class="item6" loading="lazy">
          <img src="https://source.unsplash.com/random/154x144?art" alt="Art" class="item7" loading="lazy">
          <img src="https://source.unsplash.com/random/271x144?animals" alt="Animals" class="item8" loading="lazy">
        </div>
      </div>

      <button class="read-more-btn">SEE MORE</button>
    </div>

    <script>
      // Add click handler for see more button
      document.querySelector('.read-more-btn').addEventListener('click', () => {
        alert('Loading more items...');
      });
    </script>
  </body>
</html>
