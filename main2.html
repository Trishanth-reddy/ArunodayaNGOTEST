<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom CSS */
    .timeline-wrapper {
      overflow-x: auto;
      padding: 2rem 0;
    }

    .timeline {
      position: relative;
      height: 600px;
      min-width: 1200px;
      margin: 0 auto;
    }

    .timeline-path {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: #000;
      transform: translateY(-50%);
    }

    .milestone {
      position: absolute;
      width: 300px;
      transform: translateY(-50%);
    }

    .milestone .card {
      width: 250px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .milestone.left .card {
      right: 50px;
    }

    .milestone.right .card {
      left: 50px;
    }

    .timeline-dot {
      width: 20px;
      height: 20px;
      background: #ff6b6b;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 50%;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .timeline {
        height: auto;
        min-width: 800px;
      }
      
      .milestone {
        width: 200px;
      }
      
      .milestone .card {
        width: 180px;
        font-size: 0.9rem;
      }
      
      .milestone.left .card {
        right: 30px;
      }
      
      .milestone.right .card {
        left: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="timeline-wrapper">
    <div class="timeline">
      <div class="timeline-path"></div>

      <!-- Milestones -->
      <div class="milestone left" style="left: 10%; top: 50%">
        <div class="timeline-dot"></div>
        <div class="card p-3">
          <h3>November 21, 2008</h3>
          <p>Registered Under Trust Act 1882 Bearing No 20 of 2008</p>
        </div>
      </div>

      <div class="milestone right" style="left: 30%; top: 50%">
        <div class="timeline-dot"></div>
        <div class="card p-3">
          <h3>May 11, 2009</h3>
          <p>Establishment of Arunodaya Orphan Home with 12 Children</p>
        </div>
      </div>

      <div class="milestone left" style="left: 50%; top: 50%">
        <div class="timeline-dot"></div>
        <div class="card p-3">
          <h3>May 28, 2010</h3>
          <p>Registered Under Income Tax 1961 Under Section 12A</p>
        </div>
      </div>

      <!-- Add more milestones as needed -->

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
